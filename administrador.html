<script>

// ================= SOCKET.IO STOCK EN TIEMPO REAL =================

const socket = io("http://localhost:3000");


socket.on("actualizarStock", (stock) => {

    console.log("Stock recibido del servidor:", stock);

    actualizarStockCliente(stock);

});


// ================= MOSTRAR STOCK =================

function actualizarStockCliente(stock){


    document.querySelectorAll(".card").forEach(card=>{


        let categoria = card.dataset.categoria;
        let producto = card.dataset.producto;


        // borrar estado anterior

        let viejo = card.querySelector(".estado-stock");

        if(viejo){
            viejo.remove();
        }



        if(stock[categoria] && stock[categoria][producto]){


            let cantidad = stock[categoria][producto].stock;


            let estado = "";
            let clase = "";



            if(cantidad <= 0){

                estado = "⚫ SIN STOCK";
                clase = "negro";


                let botones = card.querySelectorAll(".comprar");

                botones.forEach(boton=>{

                    boton.disabled = true;
                    boton.innerText = "SIN STOCK";

                });



            }else if(cantidad <= 5){


                estado = "🟡 POCO STOCK";
                clase = "amarillo";



            }else{


                estado = "🟢 DISPONIBLE";
                clase = "verde";


            }



            let div = document.createElement("div");

            div.className = "estado-stock " + clase;

            div.innerHTML = estado;


            card.querySelector(".info").appendChild(div);


        }


    });


}

</script>
